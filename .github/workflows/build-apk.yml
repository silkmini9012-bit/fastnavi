name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            java -version
            chmod +x gradlew
            # Gradle 배포판 다운로드가 일시적으로 실패하는 경우 재시도
            for i in $(seq 1 15); do ./gradlew --no-daemon --version >/dev/null 2>&1 && break; echo "gradle download retry $i"; sleep 45; done
            echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
            ok=0
            for i in $(seq 1 8); do
              if ./gradlew --no-daemon assembleDebug; then ok=1; break; fi
              echo "build retry $i"; sleep 45
            done
            [ "$ok" = 1 ]
          } 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk FastNavi.apk
      # 실패 시 빌드 로그를 ci-log 브랜치에 올려서 확인할 수 있게 함
      - name: Upload log on failure
        if: failure()
        run: |
          mkdir -p /tmp/log
          cp build.log /tmp/log/ 2>/dev/null || echo "build step did not run" > /tmp/log/build.log
          cd /tmp/log
          git init -q -b ci-log
          git config user.name ci && git config user.email ci@example.com
          git add . && git commit -q -m "build log ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-log
      - uses: actions/upload-artifact@v4
        with:
          name: FastNavi-apk
          path: FastNavi.apk
      # 폰에서 바로 받을 수 있도록 Releases에 .apk 직접 첨부
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 빠른길 내비 빌드 ${{ github.run_number }}
          files: FastNavi.apk
